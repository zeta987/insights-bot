version: "2"
linters:
  # The v2 standard set (errcheck, govet, ineffassign, staticcheck, unused) is
  # on by default; gosimple is now part of staticcheck.
  enable:
    - containedctx
    - dupl
    - durationcheck
    - errname
    - exhaustive
    - forcetypeassert
    - godot
    - goheader
    - goprintffuncname
    - gosec
    - musttag
    - nestif
    - nolintlint
    - nosprintfhostport
    - prealloc
    - predeclared
    - reassign
    - revive
    - testableexamples
    - unconvert
    - usestdlibvars
    - whitespace
    - wsl
    # Left off since the v1 config, originally due to
    # https://github.com/golangci/golangci-lint/issues/3086#issuecomment-1475232706
    # - bodyclose
    # - contextcheck
    # - nilerr
    # - noctx
    # - unparam
  disable:
    - depguard
  settings:
    revive:
      rules:
        - name: blank-imports
          disabled: true
    wsl:
      strict-append: false
      allow-assign-and-call: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Generated ent code repeats itself by design.
      - linters:
          - dupl
        path: ent/.*\.go
      # The four rules below silence wsl cuddling messages.
      - path: (.+)\.go$
        text: if statements should only be cuddled with assignments
      - path: (.+)\.go$
        text: if statements should only be cuddled with assignments used in the if statement itself
      # False positive case: var a bool\nb := true
      - path: (.+)\.go$
        text: assignments should only be cuddled with other assignments
      - path: (.+)\.go$
        text: declarations should never be cuddled
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
